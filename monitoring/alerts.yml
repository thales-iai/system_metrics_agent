groups:
  - name: agent-alerts
    rules:
      - alert: AgentSilencieux
        expr: time() - agent_last_received_timestamp_seconds > 60
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Aucune métrique reçue de {{ $labels.hostname }} depuis plus de 60 s"
      - alert: CPUEleve
        expr: agent_cpu_percent > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CPU supérieur à 90 % sur {{ $labels.hostname }}"
      - alert: MemoireElevee
        expr: agent_memory_percent > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "RAM supérieure à 90 % sur {{ $labels.hostname }}"